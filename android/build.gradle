buildscript {
    ext {
        buildToolsVersion = "34.0.0"      // you can keep 34.0.0, it's fine with compileSdk 35
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ⬇️ IMPORTANT: pin Android Gradle Plugin to 8.2.1 (matches RN 0.74)
        classpath("com.android.tools.build:gradle:8.2.1")

        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force androidx.core to a version compatible with AGP 8.2.x / RN 0.74
subprojects { project ->
    project.configurations.all { config ->
        config.resolutionStrategy {
            force "androidx.core:core:1.12.0"
            force "androidx.core:core-ktx:1.12.0"
        }
    }
}
